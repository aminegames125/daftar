name: daftar
description: "Daftar - your life, in your pocket."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # State + navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0

  # Local database (offline-first, sync-ready)
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  uuid: ^4.6.0

  # Formatting, utils, vector assets
  intl: ^0.20.3
  collection: ^1.19.1
  flutter_svg: ^2.3.0

  # Maps (Google Maps SDK, key in android/local.properties) + location
  geolocator: ^14.1.1

  # Charts (price history, spending)
  fl_chart: ^1.2.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  http: ^1.6.0
  mobile_scanner: ^7.4.2
  google_mlkit_text_recognition: ^0.17.1
  local_auth: ^3.0.2
  sensors_plus: ^7.1.1
  crypto: ^3.0.7
  google_maps_flutter: ^2.19.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  share_plus: ^13.3.1
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/brand/

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/png/app_icon_square.png
  adaptive_icon_background: "#0B0D10"
  adaptive_icon_foreground: assets/brand/png/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/png/icon_monochrome.png
  min_sdk_android: 24

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B0D10"
  image: assets/brand/png/splash_mark.png
  android_12:
    color: "#0B0D10"
    image: assets/brand/png/splash_mark.png
    icon_background_color: "#0B0D10"
  ios: false
  web: false
